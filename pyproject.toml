[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laniakea-operator"
version = "0.1.0"
description = "Differentiable Barnes-Hut operator with a second-derivative error bound (minimal reproduction package)"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.24", "torch>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
